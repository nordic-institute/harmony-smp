ecas.auth.orderedEnabledStrengths=MOBILE_APP,PASSWORD_WEBAUTHN,PASSWORD_MOBILE_APP,PASSWORD_SOFTWARE_TOKEN,PASSWORD_SMS,PASSWORD_TOKEN,PASSWORD_TOKEN_CRAM,BASIC,EIDAS,SOCIAL_NETWORKS,WINDOWS,FEDERATION,CLIENT_CERT
