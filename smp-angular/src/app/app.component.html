<alert #alertMessage ></alert>
<spinner [show]="showSpinner" [size]="150"></spinner>
<div style="display:flex; flex-direction: column;height: 100%">
  <mat-sidenav-container id="smp-window" style="flex: 1 1 auto;">
    <mat-sidenav #sidenavDrawer [ngClass]="menuClass" mode="side" opened>
      <div id="topLogo">
        <img src="assets/images/Logo.svg"/>
      </div>
      <smp-sidenav #sidenav />
      <a
        mat-menu-item
        [disableRipple]="true"
        href="https://edelivery.digital/smp-licence-info"
        target="_blank"
        rel="noopener"
        class="nav-tree-licence-button"
        [matTooltip]="!fullMenu ? 'Licence info' : ''"
        matTooltipPosition="right"
      >
        <mat-icon>business</mat-icon>
        <span>Licence info</span>
        <mat-icon iconPositionEnd class="open-external-icon">open_in_new</mat-icon>
      </a>
      <div class="collapse-button">
        <button mat-icon-button id="collapse_toggle_id" (click)="toggleMenu()"
                [attr.aria-label]="fullMenu ? ('app.component.tooltip.collapse' | translate) : ('app.component.tooltip.expand' | translate)">
          <mat-icon [class.collapse-icon-rotated]="!fullMenu">chevron_left</mat-icon>
        </button>
      </div>
    </mat-sidenav>
    <mat-sidenav-content (scroll)="onDrawerContentScroll($event);">
      <window-toolbar />
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
