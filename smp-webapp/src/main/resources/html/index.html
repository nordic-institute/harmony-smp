<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <title>Harmony SMP Service</title>
  <link rel="icon" type="image/x-icon"
        href="images/favicon.ico"/>
  <link rel="stylesheet" href="styles/domismp.css"/>

  <script type="text/javascript">

    function toggleToolbar() {
      const toolbar = document.getElementById('toolbar');
      const content = document.getElementById('content');
      toolbar.classList.toggle('tb-collapsed');
      content.classList.toggle('tb-collapsed');
    }
  </script>
</head>
<body>
<div class="toolbar" id="toolbar">
  <div class="logo-div">
    <div class="logo" >&nbsp;</div>
  </div>
  <h2>Toolbar</h2>
  <a href="ui/index.html" title="SMP UI page">
    <span class="action-icon">&#x2302;</span>
    <span class="action-label">SMP UI</span></a>
  <a href="https://ec.europa.eu/digital-building-blocks/sites/display/DIGITAL/eDelivery+SMP" target="_blank"  title="eDelivery SMP specification">
    <span class="action-icon icon-ec-logo">&nbsp;</span>
    <span class="action-label">eDelivery SMP</span></a>
  <a href="https://docs.oasis-open.org/bdxr/bdx-smp/v2.0/bdx-smp-v2.0.html" target="_blank"  title="Oasis SMP 2.0 specification">
    <span class="action-icon icon-oasis-logo">&nbsp;</span>
    <span class="action-label">Oasis SMP 2.0</span></a>
  <a href="https://docs.oasis-open.org/bdxr/bdx-smp/v1.0/bdx-smp-v1.0.html" target="_blank"  title="Oasis SMP 1.0 specification">
    <span class="action-icon icon-oasis-logo-old">&nbsp;</span>
    <span class="action-label">Oasis SMP 1.0</span></a>

  <button class="toggle-button" onclick="toggleToolbar()">
    <span id="expanded">&#x2770;</span>
    <span id="collapsed">&#x2771;</span>
  </button>
</div>
<div class="content" id="content">
  <div class="app-info">
    <h1>Harmony SMP (Service Metadata Publisher) is waiting for you</h1>
    <p>Version: ${project.version}</p>
    <p>Build time: ${buildtimestamp}</p>
  </div>
</div>
</body>
</html>
